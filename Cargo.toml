[package]
name = "tree-sitter-cstack"
description = "CrateStack .cstack grammar for tree-sitter"
version = "0.1.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cstack"]
categories = ["parser-implementations", "text-editors"]
repository = "https://github.com/cratestack/tree-sitter-cstack"
edition = "2021"
autoexamples = false
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "LICENSE"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.25"

[lints.rust]
unsafe_code = "allow"  # the generated C parser is reached through an extern "C" declaration
